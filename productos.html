<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos – DAHE</title>

    <!-- Enlazar HTML con la librería principal CSS de bootstrap -->
    <!-- OJO: Esta librería debe ir antes de cualquier otra librería CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Link para enlazar html con la libreria de iconos de bootstrap     -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="productos-page">

    <section id="productos-header" class="contenedor espaciado">
        <div class="titulo-productos">
            <img src="/assets/images/logos/logo_DAHE_3.png" alt="" class="logo-productos">
            <h2>Tinas de PRFV</h2>
        </div>
    </section>

    <section id="productos-lista" class="contenedor espaciado">
        <div class="grid-productos"></div>

        <a href="index.html" class="btn-inicio">Regresar al inicio</a>
    </section>




    <!-- MODAL GENERAL -->
    <div id="modal" class="modal">

        <!-- CONTENEDOR DEL MODAL -->
        <div class="modal-content">

            <!-- BOTÓN DE CIERRE -->
            <button id="cerrarModal" class="btn-cerrar-modal">
    <i class="bi bi-x-lg"></i>
</button>


            <!-- ============================= -->
            <!-- SECCIÓN SUPERIOR: CARRUSEL    -->
            <!-- ============================= -->
            <div class="modal-carrusel">

                <!-- Carrusel de Bootstrap -->
                <div id="modalCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel">

                    <!-- Contenedor donde se insertarán las imágenes dinámicamente -->
                    <div class="carousel-inner" id="carousel-inner"></div>

                </div>

                <!-- CONTENEDOR NUEVO PARA LAS FLECHAS ABAJO Y CENTRADAS -->
                <div class="carousel-controls-bottom">
                    <button class="carousel-control-prev" type="button" data-bs-target="#modalCarousel"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon"></span>
                    </button>

                    <button class="carousel-control-next" type="button" data-bs-target="#modalCarousel"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon"></span>
                    </button>
                </div>

            </div>



            <!-- ============================= -->
            <!-- SECCIÓN INFERIOR: INFORMACIÓN -->
            <!-- ============================= -->
            <div class="modal-info">
                <h2 id="modalTitulo"></h2> <!-- Nombre del producto -->
                <p id="modalDescripcion"></p> <!-- Texto de características -->
            </div>

        </div>
    </div>





    <!-- SCRIPT DEL MODAL -->

    <script src="js/productos.js"></script>

    <!-- Enlazar HTML con la librería principal de JavaScript de bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

</body>

</html>
